<div class="card">
    <div class="card-body">
        <h2 class="h5 mb-4">Neues Buch anlegen</h2>

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Titel *</label>
                    <input class="form-control" type="text" formControlName="titel" />
                    <div
                        class="text-danger small mt-1"
                        *ngIf="form.get('titel')?.touched && form.get('titel')?.hasError('required')"
                    >
                        Titel darf nicht leer sein.
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Untertitel</label>
                    <input class="form-control" type="text" formControlName="untertitel" />
                    <div
                        class="text-danger small mt-1"
                        *ngIf="form.get('untertitel')?.touched && form.get('untertitel')?.hasError('required')"
                    >
                        Untertitel darf nicht leer sein.
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">ISBN *</label>
                    <input class="form-control" type="text" formControlName="isbn" />
                    <div class="text-danger small mt-1" *ngIf="form.get('isbn')?.touched && form.get('isbn')?.errors">
                        Format: 978-0-xxx-xxxxx-x (Bindestriche an den Stellen lassen, 13 Ziffern).
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Art *</label>
                    <select class="form-select" formControlName="art">
                        <option *ngFor="let option of artOptionen" [value]="option">
                            {{ option }}
                        </option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Rating *</label>
                    <div class="d-flex flex-wrap gap-2">
                        <div class="form-check form-check-inline" *ngFor="let option of ratingOptionen">
                            <input
                                class="form-check-input"
                                type="radio"
                                [value]="option"
                                formControlName="rating"
                                id="rating-{{ option }}"
                            />
                            <label class="form-check-label" for="rating-{{ option }}">
                                {{ option }}
                            </label>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Lieferbar</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" formControlName="lieferbar" id="lieferbar" />
                        <label class="form-check-label" for="lieferbar">
                            Sofort lieferbar
                        </label>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Preis (EUR) *</label>
                    <input class="form-control" type="number" step="0.01" formControlName="preis" />
                </div>

                <div class="col-md-6">
                    <label class="form-label">Rabatt *</label>
                    <input class="form-control" type="number" step="0.001" min="0" max="1" formControlName="rabatt" />
                    <div class="form-text">
                        Angabe als Dezimalzahl (z.B. 0.150 = 15%)
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Erscheinungsdatum</label>
                    <div class="input-group">
                        <input
                            class="form-control"
                            ngbDatepicker
                            #dp="ngbDatepicker"
                            formControlName="datum"
                            placeholder="JJJJ-MM-TT"
                        />
                        <button class="btn btn-outline-secondary" type="button" (click)="dp.toggle()">
                            Kalender
                        </button>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Homepage</label>
                    <input class="form-control" type="url" formControlName="homepage" />
                    <div
                        class="text-danger small mt-1"
                        *ngIf="form.get('homepage')?.touched && form.get('homepage')?.hasError('required')"
                    >
                        Homepage darf nicht leer sein.
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label">Schlagwoerter</label>
                    <div class="d-flex flex-wrap gap-3" formGroupName="schlagwoerter">
                        <div class="form-check" *ngFor="let wort of schlagwortKatalog">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                [formControlName]="wort"
                                id="schlag-{{ wort }}"
                            />
                            <label class="form-check-label" for="schlag-{{ wort }}">
                                {{ wort }}
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-primary" type="submit">
                    Speichern
                </button>
                <button class="btn btn-outline-secondary" type="button" (click)="form.reset(defaultWerte)">
                    Zuruecksetzen
                </button>
            </div>
        </form>
    </div>
</div>
